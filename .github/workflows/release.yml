name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  BUN_VERSION: '1.3.14'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} is not on origin/main."
            exit 1
          fi

      - name: Ensure tag matches package.json version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PACKAGE_VERSION="$(cat package.json | grep '"version"' | head -1 | awk -F'"' '{print $4}')"
          if [ "${TAG_NAME}" != "${PACKAGE_VERSION}" ]; then
            echo "Tag ${TAG_NAME} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

  build-linux:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux binary
        run: bun run build

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umbod
          path: dist/umbod

  build-windows:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows binary
        run: bun run build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umbod.exe
          path: dist/umbod.exe

  release:
    runs-on: ubuntu-24.04
    needs: [build-linux, build-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: umbod
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: umbod.exe
          path: dist/

      - name: Mark binaries executable
        run: chmod +x dist/umbod

      - name: Generate checksums
        run: |
          cd dist
          sha256sum umbod umbod.exe > umbod-checksums.txt

      - name: Render pinned installers
        run: |
          sed -e "s|__UMBOD_RELEASE_REF__|${GITHUB_REF_NAME}|g" \
              -e "s|__UMBOD_IS_RELEASE__|true|g" \
              install.sh > dist/install.sh
          chmod +x dist/install.sh
          sed -e "s|__UMBOD_RELEASE_REF__|${GITHUB_REF_NAME}|g" \
              -e "s|__UMBOD_IS_RELEASE__|true|g" \
              install.ps1 > dist/install.ps1

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/umbod
            dist/umbod.exe
            dist/umbod-checksums.txt
            dist/install.sh
            dist/install.ps1
