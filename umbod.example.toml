[env]
name = "my-dev-env"
version = "1.0.0"
timeout = 30

# Optional server configuration. Defaults to 127.0.0.1:9090 if omitted.
# [server]
# host = "127.0.0.1"
# port = 9090

[policy]
default_unknown = "approve"
approval_method = "both" # web | cli | both

[rules]
# Hidden file blocking, matches on Bash and Tool calls
'/(^|\/)\.[^\s\/]+/' = "block"

"rm *" = "approve"
"git push *" = "approve"
"git reset --hard *" = "approve"
"git clean -fd*" = "approve"

"git status" = "allow"

# Workspaces are generic named policy scopes. Hosts may send workspaceId
# directly; otherwise Umbod selects the longest matching working-directory root.
[[workspaces]]
id = "client-production"
roots = ["/work/client-app", "C:\\work\\client-app"]
default_unknown = "block"

[workspaces.rules]
"git push *" = "block"
"terraform plan *" = "approve"

[[workspaces]]
id = "personal-sandbox"
roots = ["/work/sandbox"]
default_unknown = "allow"

[workspaces.rules]
"git push origin scratch" = "allow"
